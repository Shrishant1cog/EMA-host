name: Keep EMA Render Services Warm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping primary EMA service
        run: |
          curl --fail --silent --show-error --max-time 25 \
            -H "Cache-Control: no-cache" \
            https://ema-host.onrender.com/health

      - name: Ping request-sender EMA service
        run: |
          curl --fail --silent --show-error --max-time 25 \
            -H "Cache-Control: no-cache" \
            https://ema-request-sender.onrender.com/health
