[build]
  publish = "frontend"

# Production uses same-origin API URLs. These rewrites proxy those requests to
# the Render API so cookies and browser requests stay on the frontend origin.
# Update this origin if the Render service's public hostname changes.
[[redirects]]
  from = "/api/*"
  to = "https://ema-host.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://ema-host.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://ema-host.onrender.com/health"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/ema-entry.mp4"
  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"
